{% extends "base.html" %}
{% block title %}{{ 'Edit' if task else 'New' }} Task — StudyPal{% endblock %}
{% block content %}
<div class="page-narrow">
    <h1>{{ 'Edit Task' if task else 'New Task' }} <span class="muted">— {{ module.name }}</span></h1>
    <form method="POST" class="form">
        <label>Title
            <input type="text" name="title" value="{{ task.title if task else '' }}" placeholder="e.g. Database Coursework" required>
        </label>
        <label>Description (optional)
            <textarea name="description" rows="2">{{ task.description if task else '' }}</textarea>
        </label>
        <label>Due date
            <input type="date" name="due_date" value="{{ task.due_date.isoformat() if task else '' }}" required>
        </label>
        <label>Priority
            <select name="priority">
                {% for p in ['low', 'medium', 'high'] %}
                <option value="{{ p }}" {{ 'selected' if task and task.priority == p else '' }}>{{ p|capitalize }}</option>
                {% endfor %}
            </select>
        </label>
        <label>Difficulty (1 = easy, 5 = very hard)
            <input type="number" name="difficulty" min="1" max="5" value="{{ task.difficulty if task else 3 }}" required>
        </label>
        <label>Estimated hours needed
            <input type="number" name="estimated_hours" min="0.5" step="0.5" value="{{ task.estimated_hours if task else '' }}" required>
        </label>
        <label class="checkbox-label">
            <input type="checkbox" name="is_struggling" {{ 'checked' if task and task.is_struggling else '' }}>
            I'm struggling with this topic
        </label>
        <button type="submit" class="btn">{{ 'Save Changes' if task else 'Add Task' }}</button>
        <a href="{{ url_for('tasks.list_tasks', module_id=module.id) }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
